about_content: | # this will include new lines to allow paragraphs
  반복되는 해양 데이터 분석과 업무를 코드를 통해 자동화하는 경험을 계기로, 데이터를 다루는 개발에 관심을 갖게 되었습니다. 최근에는 Kyro 프로젝트를 통해 대량의 실시간 지표, 로그 데이터 수집하는 파이프라인을 설계하고 구현하며, 흩어진 데이터를 정제하고 구조화하는 경험을 하였습니다.<br>
  신뢰할 수 있는 데이터를 기반으로 더 정확한 분석과 가치 있는 서비스를 만드는 개발자가 되겠습니다.

