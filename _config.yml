            quote: >
              Kubernetes 장애 분석부터 복구 PR 제안까지 지원하는 AI 운영 플랫폼
            description: | # this will include new lines to allow paragraphs
              1. Prometheus·Loki·Tempo·K8s 관측 데이터 수집 파이프라인 구축
              2. Provider 실패와 no signal을 구분해 장애 분석 근거의 신뢰도와 판단 기준 개선
              3. 1MiB payload 제한과 데이터 축약 처리로 대용량 관측 데이터 전송 안정성 확보
              4. ConfigMap·Secret 참조 분석에서 민감정보 비노출을 37개 테스트로 검증

