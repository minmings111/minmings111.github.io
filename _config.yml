# About Section
about_title: About Me
about_profile_image: images/LeeMinJeong_id_photo.png
about_content: | # this will include new lines to allow paragraphs
  해양 데이터 분석과 업무 자동화 경험을 계기로, 개발에 관심을 갖게 되었습니다. 반복되는 데이터 처리 과정에서 기준을 세우고 흐름을 자동화하는 일의 중요성을 체감했습니다. 현재는 백엔드와 데이터 처리 흐름을 학습하며, 흩어진 데이터를 정제하고 구조화하는 역량을 쌓고 있습니다. 데이터의 수집부터 저장, 활용까지 일관된 흐름을 설계하는 개발자를 목표로 하고 있습니다.<br>
  신뢰할 수 있는 데이터를 기반으로 더 정확한 분석과 가치 있는 서비스를 만드는 개발자가 되겠습니다.

