# About Section
about_title: About Me
about_profile_image: images/LeeMinJeong_id_photo.png
about_content: | # this will include new lines to allow paragraphs
  <mark>해양 데이터 분석</mark>과 <mark>업무 자동화 경험</mark>을 계기로, 개발에 관심을 갖게 되었습니다. 반복되는 데이터 처리 과정에서 <mark>기준을 세우고</mark> 흐름을 자동화하는 일의 중요성을 체감했습니다. 현재는 백엔드와 데이터 처리 흐름을 학습하며, 흩어진 데이터를 정제하고 구조화하는 역량을 쌓고 있습니다. 데이터의 수집부터 저장, 활용까지 일관된 흐름을 설계하는 개발자를 목표로 하고 있습니다.<br>
  <mark>신뢰할 수 있는 데이터</mark>를 기반으로 더 <mark>정확한 분석과 가치 있는 서비스</mark>를 만드는 개발자가 되겠습니다.
  <br><br>
  현재는 마지막 팀 프로젝트였던 <a href="https://github.com/minmings111/Kyro-jungle-final">Kyro</a>를 기반으로, <a href="https://github.com/minmings111/kyro-java">kyro-java</a>에서 구조를 재정비하며 완성도를 높이고 있습니다.

content:
  - title: Projects # Title for the section
    layout: list # Type of content section (list/text)
    content:
      - layout: top-middle # top-middle
        title: Kyro
        sub_title: 크래프톤 정글
        caption: 2026.06.22. - 2026.07.25.(5명)
        # link: github.com/minmings111/Kyro-jungle-final
        # link_text: Project Website
        additional_links:
          - title: github.com/minmings111/Kyro-jungle-final
            icon: fab fa-github
            url: github.com/minmings111/Kyro-jungle-final
          # - title:  Github page for project (eg. sproogen/modern-resume-theme)
          #   icon: fab fa-github
          #   url: Link to project (eg. sproogen.github.io/modern-resume-theme)
        quote: >
          Prometheus, Loki, Tempo, K8s 메타데이터를 통합해 장애 원인, 영향 범위, 근거를 한 흐름에서 관측·분석하는 통합 솔루션
        description: | # this will include new lines to allow paragraphs
          1. Kubernetes 장애 분석 <mark>데이터 파이프라인</mark> 구현
          - metrics/logs/traces/metadata를 공통 Evidence Schema로 수집·정규화
          - provider별 collection status와 reason code를 기록해 no signal과 collection failure 구분
          - payload size limit과 truncation metadata로 대용량 telemetry 처리 안정화
          - Loki logs에서 severity, 장애 패턴, trace id를 추출해 비정형 로그를 RCA용 structured signal로 변환
          - 민감정보 redaction과 log line limiting을 적용해 분석 정확도와 데이터 노출 위험을 함께 관리

          2. <mark>Event-driven</mark> RCA Workflow 설계
          - 장애 수집·분석·복구 단계를 이벤트 기반 workflow로 분리
          - typed event contract로 단계 간 데이터 전달 경계 정리
          - correlation ID 기반으로 하나의 장애 분석 흐름을 추적 가능하도록 구성

          3. Cluster-Agent <mark>outbound</mark> 수집 구조 구현
          - cluster-agent가 management server를 polling하는 async pull 구조 구현
          - provider별 수집 job을 독립 실행해 특정 provider 장애 영향 격리
          - retry 흐름을 관리해 일부 실패 상황에서도 수집 가능한 근거 확보

  - title: Education & Training
    layout: list # Type of content section (list/text)
    content:
      - layout: left
        title: 크래프톤 정글
        caption: 2026.03.02. - 2026.07.30.
        sub_title: 12기 수료
        # quote: >
        #   몰입형 학습과 팀 프로젝트를 통한 컴퓨터 과학 기초와 운영체제, 네트워크, 알고리즘을 집중적으로 학습한 개발자 교육 과정
        description: | # this will include new lines to allow paragraphs
          - 자료구조 및 알고리즘 학습을 통한 문제 해결 역량 강화
          - C언어, 컴퓨터 구조, 운영체계 등 컴퓨터 과학 기초 학습
          - 신경망 및 LLM 구현을 통한 AI 모델의 동장 원리 이해 및 활용

      - layout: left
