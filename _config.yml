# About Section
about_title: About Me
about_profile_image: images/LeeMinJeong_id_photo.png
about_content: | # this will include new lines to allow paragraphs
  백엔드 개발자로서 신뢰할 수 있는 코드로 안정적인 시스템을 만드는 것을 목표로 하고 있습니다. 주어진 요구사항을 정확히 이해하고, 일정과 품질을 함께 지키는 개발을 중요하게 생각합니다.

  현재는 마지막 팀 프로젝트였던 <a href="https://github.com/minmings111/Kyro-jungle-final"><mark>Kyro</mark></a>를 기반으로, <a href="https://github.com/minmings111/kyro-java"><mark>kyro-java</mark></a>에서 <mark>구조를 재정비</mark>하며 완성도를 높이고 있습니다.

content:
  - title: Projects # Title for the section
    layout: list # Type of content section (list/text)
    content:
      - layout: left # top-middle
        title: Kyro
        sub_title: 크래프톤 정글
        caption: 2026.06.22. - 2026.07.25.(5명)
        # link: github.com/minmings111/Kyro-jungle-final
        # link_text: Project Website
        additional_links:
          - title: github.com/minmings111/Kyro-jungle-final
            icon: fab fa-github
            url: github.com/minmings111/Kyro-jungle-final
          # - title:  Github page for project (eg. sproogen/modern-resume-theme)
          #   icon: fab fa-github
          #   url: Link to project (eg. sproogen.github.io/modern-resume-theme)
        quote: >
          Prometheus, Loki, Tempo, K8s 메타데이터를 통합해 장애 원인, 영향 범위, 복구 근거를 한 흐름에서 분석하는 관측 데이터 통합 솔루션
        description: | # this will include new lines to allow paragraphs
          Kubernetes 장애 RCA(Root Cause Analysis)를 위한 event-driven evidence ingestion pipeline 구현
          - Prometheus metrics, Loki logs, Tempo traces, Kubernetes metadata를 수집하고 후속 RCA 처리 흐름에서 사용할 수 있는 공통 evidence schema로 정규화
          - provider별 collection status를 'completed', 'partial', 'unavailable' 상태와 reason code로 보존해 evidence freshness/completeness validation이 가능하도록 처리
          - Loki logs에서 severity, 장애 패턴, trace id를 추출하고 민감정보 redaction을 적용해 원인 분석에 필요한 로그 근거만 전달
          - Prometheus/Tempo/metadata payload 크기를 제한하고 truncation metadata를 남겨 대용량 관측 데이터의 축약 여부를 추적 가능하게 처리

