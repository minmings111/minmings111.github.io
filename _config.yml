        # quote: >
        #   AI 관련 기술을 보유한 실무인재 양성 교육 프로그램
        description: | # this will include new lines to allow paragraphs
          - 머신러닝·딥러닝 핵심 개념 및 모델링 프로세스 학습
          - Cursor, ChatGPT 등 생성형 AI 도구 활용 및 실습
          - Java 기반 객체지향 프로그래밍, Spring Boot, Oracle DB, React 기초 학습

